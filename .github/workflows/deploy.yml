# Publica o MORTEM no GitHub Pages a cada commit na branch de trabalho.
# Pré-requisitos (uma vez só, no GitHub):
#   1. Tornar o repositório PÚBLICO (Settings → General → Danger Zone).
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Feito isso, o link fica em: https://santosbruno94.github.io/Mortem-new/
name: Publicar no GitHub Pages

on:
  push:
    branches: ['claude/mortem-universal-grammar-inkl2q']
  workflow_dispatch: # permite publicar manualmente pelo botão "Run workflow"

# Permissões que o deploy do Pages exige.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; cancela a anterior se uma nova começar.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
